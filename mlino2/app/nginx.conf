# nginx.conf — اپ V2 روی HTTPS (Secure Context الزامی دوربین/قطب‌نما)
# پورت 8443؛ گواهی self-signed در build-time داخل image تولید می‌شود
# (راهنمای پذیرش هشدار روی گوشی: HANDOFF/20260907_docker_fieldtest_REPORT.md بخش ۳).

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev-cert.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # دوربین + سنسورهای جهت‌یابی برای ویترین AR — در Secure Context مجاز
    add_header Permissions-Policy "camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), geolocation=(self)" always;
    # حداقل هدرهای امنیتی استاتیک
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # فایل عمومی امضاشده؛ مسیر دقیق، بدون بازگشت به برنامهٔ تک‌صفحه‌ای.
    location = /public-export/public-business.v1.json {
        alias /srv/mlino-public-export/public-business.v1.json;
        if (!-f /srv/mlino-public-export/public-business.v1.json) { return 404; }
        limit_except GET { deny all; }
        types { }
        default_type application/json;
        charset_types application/json;
        charset utf-8;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Permissions-Policy "camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), geolocation=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /public-export/public-catalog.v1.json {
        alias /srv/mlino-public-export/public-catalog.v1.json;
        if (!-f /srv/mlino-public-export/public-catalog.v1.json) { return 404; }
        limit_except GET { deny all; }
        types { }
        default_type application/json;
        charset_types application/json;
        charset utf-8;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Permissions-Policy "camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), geolocation=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ^~ prevents the general 404 guard below from routing valid media to the SPA.
    # The regex validates the entire URI; \1 requires the hash to start with its directory prefix.
    location ^~ /public-export/media/sha256/ {
        if ($uri !~ "^/public-export/media/sha256/([0-9a-f]{2})/\1[0-9a-f]{62}\.(avif|webp|jpg|png)$") { return 404; }
        alias /srv/mlino-public-export/media/sha256/;
        try_files $uri =404;
        limit_except GET { deny all; }
        types { image/avif avif; image/webp webp; image/jpeg jpg; image/png png; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Permissions-Policy "camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), geolocation=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ^~ /public-export/ { return 404; }

    # دروازه‌ی دستیار (طرح مصوب U1-O5، هم‌مبدأ): فقط وقتی استقرار تکه‌ی پیکربندی آن را بگذارد
    # (نمونه: nginx-assistant.conf.example). بدون آن، هر مسیر /assistant/ یک ۴۰۴ واقعی است.
    include /etc/nginx/mlino.d/*.conf;
    location ^~ /assistant/ { return 404; }

    # شناسهٔ ساخت: نبود فایل ۴۰۴ واقعی است و هرگز HTML برنامه برنمی‌گردد.
    location = /version.json {
        alias /usr/share/nginx/html/version.json;
        if (!-f /usr/share/nginx/html/version.json) { return 404; }
        limit_except GET { deny all; }
        types { }
        default_type application/json;
        charset_types application/json;
        charset utf-8;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Permissions-Policy "camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), geolocation=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), geolocation=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SPA fallback — مسیرهای ناشناخته به index.html (اپ تک‌صفحه‌ای با تبن‌ها)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets هش‌دار → کش بلندمدت
    # (nginx: add_header در level پایین‌تر وراثت را قطع می‌کند — هدرها اینجا هم تکرار شده‌اند)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Permissions-Policy "camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), geolocation=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # دفاع در عمق: حتی اگر فایلی با پسوند env/local جایی لو رفت، سرو نمی‌شود
    location ~* \.(env|local)$ {
        return 404;
    }
}
