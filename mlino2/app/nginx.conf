# nginx.conf — اپ V2 روی HTTPS (Secure Context الزامی دوربین/قطب‌نما)
# پورت 8443؛ گواهی self-signed در build-time داخل image تولید می‌شود
# (راهنمای پذیرش هشدار روی گوشی: HANDOFF/20260907_docker_fieldtest_REPORT.md بخش ۳).

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev-cert.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # دوربین + سنسورهای جهت‌یابی برای ویترین AR — در Secure Context مجاز
    add_header Permissions-Policy "camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), geolocation=(self)" always;
    # حداقل هدرهای امنیتی استاتیک
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA fallback — مسیرهای ناشناخته به index.html (اپ تک‌صفحه‌ای با تبن‌ها)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets هش‌دار → کش بلندمدت
    # (nginx: add_header در level پایین‌تر وراثت را قطع می‌کند — هدرها اینجا هم تکرار شده‌اند)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Permissions-Policy "camera=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), geolocation=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # دفاع در عمق: حتی اگر فایلی با پسوند env/local جایی لو رفت، سرو نمی‌شود
    location ~* \.(env|local)$ {
        return 404;
    }
}
