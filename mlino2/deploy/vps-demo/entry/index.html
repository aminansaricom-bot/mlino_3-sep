<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<title>ملینو</title>
<meta name="description" content="ملینو: کسب‌وکارها و مشتری‌ها را به هم وصل می‌کند.">
<link rel="icon" href="/logo.png">
<style>
@font-face { font-family: Vazirmatn; src: url('/fonts/Vazirmatn-wght.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #0b0a1a; --ink: #f3f1ff; --soft: #b9b4d8; --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.12);
  --violet: #8b5cff; --cyan: #22d3ee; --pink: #e14cff;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Vazirmatn, Tahoma, sans-serif; color: var(--ink); background: var(--bg);
  min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 28px 16px calc(28px + env(safe-area-inset-bottom)); overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(40% 35% at 25% 20%, rgba(225,76,255,.28), transparent 70%),
    radial-gradient(45% 40% at 80% 30%, rgba(34,211,238,.22), transparent 70%),
    radial-gradient(50% 45% at 50% 95%, rgba(139,92,255,.25), transparent 70%);
}
main { width: min(460px, 100%); text-align: center; }
.logo { width: 150px; height: auto; filter: drop-shadow(0 10px 40px rgba(139,92,255,.45)); animation: float 5s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
h1 { margin: 10px 0 4px; font-size: 30px; font-weight: 900; letter-spacing: -.5px; }
.lead { margin: 0 0 28px; color: var(--soft); font-size: 15px; line-height: 1.9; }
.q { margin: 0 0 14px; font-size: 17px; font-weight: 800; }
.choices { display: grid; gap: 14px; }
.choice {
  display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 24px; text-decoration: none; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); text-align: right;
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.choice:hover, .choice:focus-visible { transform: translateY(-2px); border-color: rgba(255,255,255,.3); box-shadow: 0 16px 40px rgba(0,0,0,.35); outline: none; }
.choice:active { transform: scale(.98); }
.badge { flex: none; width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-size: 26px; }
.biz .badge { background: radial-gradient(circle, rgba(225,76,255,.22), rgba(225,76,255,.04) 70%); box-shadow: inset 0 0 0 1px rgba(225,76,255,.35); }
.user .badge { background: radial-gradient(circle, rgba(34,211,238,.22), rgba(34,211,238,.04) 70%); box-shadow: inset 0 0 0 1px rgba(34,211,238,.35); }
.badge img { width: 50px; height: 50px; }
.txt { flex: 1; min-width: 0; }
.txt strong { display: block; font-size: 17px; font-weight: 800; }
.txt span { display: block; margin-top: 3px; font-size: 13px; color: var(--soft); line-height: 1.7; }
.arrow { flex: none; color: var(--soft); font-size: 20px; }
.last { display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; color: #0b0a1a; background: var(--cyan); }
footer { margin-top: 28px; font-size: 12px; color: rgba(185,180,216,.7); }
@media (prefers-reduced-motion: reduce) { .logo { animation: none; } .choice { transition: none; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="/logo.png" alt="لوگوی ملینو" width="150" height="106">
  <h1>ملینو</h1>
  <p class="lead">کسب‌وکارها را روی نقشه و در ویترین زنده پیدا کن،<br>یا کسب‌وکارت را به مشتری‌های اطرافت نشان بده.</p>
  <p class="q">کدام هستی؟</p>
  <div class="choices">
    <a class="choice user" href="https://explore.mlino.site/" data-choice="user">
      <span class="badge"><img src="/v2.png" alt=""></span>
      <span class="txt"><strong>دنبال کسب‌وکارهای اطرافم هستم</strong><span>نقشه، ویترین زنده، منو و پیشنهادها</span></span>
      <span class="arrow" aria-hidden="true">‹</span>
    </a>
    <a class="choice biz" href="https://business.mlino.site/" data-choice="business">
      <span class="badge"><img src="/v1.png" alt=""></span>
      <span class="txt"><strong>صاحب کسب‌وکار هستم</strong><span>کسب‌وکارم را معرفی و مدیریت کنم</span></span>
      <span class="arrow" aria-hidden="true">‹</span>
    </a>
  </div>
  <footer>نسخه‌ی آزمایشی · کسب‌وکارهای روی نقشه نمایشی‌اند</footer>
</main>
<script>
(function () {
  var KEY = 'mlino.entry.choice';
  var last = null;
  try { last = localStorage.getItem(KEY); } catch (e) {}
  document.querySelectorAll('.choice').forEach(function (a) {
    if (a.dataset.choice === last) {
      var tag = document.createElement('span'); tag.className = 'last'; tag.textContent = 'انتخاب قبلی';
      a.querySelector('.txt').appendChild(tag);
    }
    a.addEventListener('click', function () { try { localStorage.setItem(KEY, a.dataset.choice); } catch (e) {} });
  });
})();
</script>
</body>
</html>
